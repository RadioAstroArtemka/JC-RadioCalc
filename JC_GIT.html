<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JCJENSON — радиолюбительские расчёты</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#5c5c5c;--line:#111;--hair:#d4d4d4;--red:#c1121f;--soft:#f3f3f3;--side:#111;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#f4f4f4;--mut:#a9a9a9;--line:#f4f4f4;--hair:#333;--red:#e5303c;--soft:#1a1a1a;--side:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#f4f4f4;--mut:#a9a9a9;--line:#f4f4f4;--hair:#333;--red:#e5303c;--soft:#1a1a1a;--side:#000;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;border-right:4px solid var(--red);padding:24px 0}
.logo{padding:0 22px 22px;border-bottom:1px solid #333;margin-bottom:12px}
.logo b{display:block;font:800 28px/1 "Arial Black",Impact,Arial,sans-serif;letter-spacing:.04em}
.logo b i{font-style:normal;color:var(--red)}
.logo span{display:block;margin-top:8px;font-size:13px;color:#b5b5b5}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:5px solid transparent;color:#e8e8e8;font:inherit;font-size:15px;padding:11px 22px;cursor:pointer}
nav button:hover{background:#1f1f1f}
nav button.on{border-left-color:var(--red);background:#222;color:#fff;font-weight:700}
nav button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:1px}
main{padding:30px 38px 60px;max-width:960px;width:100%}
h1{margin:0 0 6px;font-size:26px;line-height:1.2}
.bar{height:5px;width:64px;background:var(--red);margin:10px 0 14px}
.desc{color:var(--mut);margin:0 0 24px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 18px;margin-bottom:26px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:0;padding:9px 10px}
table{width:100%;border-collapse:collapse;margin-bottom:22px}
td,th{padding:9px 6px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
tr.h th{background:var(--fg);color:var(--bg);font-size:14px;padding:8px 10px;border:0}
tr.k td:last-child{color:var(--red);font-size:18px}
thead th{border-bottom:2px solid var(--line);font-size:13px}
.note{font-size:13px;color:var(--mut);border-left:4px solid var(--red);padding:4px 12px;margin:0 0 18px;max-width:75ch}
.sub{font-size:18px;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.elw{overflow-x:auto}
.erow{display:grid;grid-template-columns:minmax(170px,1.8fr) repeat(5,minmax(60px,1fr)) 40px;gap:6px;margin-bottom:6px;min-width:600px}
.erow.hd span{font-size:13px;font-weight:600}
.erow input,.erow select{padding:7px 6px;font-size:14px}
.btn{border:2px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;border-radius:0}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.erow .btn{padding:0}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.plots svg text{fill:var(--mut);font-size:11px}
@media (max-width:820px){
.app{grid-template-columns:1fr}
aside{border-right:0;border-bottom:4px solid var(--red);padding:14px 0 0}
.logo{padding:0 16px 12px;margin-bottom:0;border:0}
nav{display:flex;overflow-x:auto}
nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:4px solid transparent;padding:10px 14px}
nav button.on{border-bottom-color:var(--red)}
main{padding:22px 16px 50px}
}
:root{--bg:#f6f5f3;--panel:#fff;--fg:#171717;--mut:#6a6a6a;--bd:#dcd9d4;--hair:#e4e1dc;--red:#a6192e;--side:#141414;--line:#bdb9b2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--panel:#1a1a1a;--fg:#ececec;--mut:#9d9d9d;--bd:#323232;--hair:#2a2a2a;--red:#d63e4e;--side:#0a0a0a;--line:#4a4a4a}}
:root[data-theme="dark"]{--bg:#111;--panel:#1a1a1a;--fg:#ececec;--mut:#9d9d9d;--bd:#323232;--hair:#2a2a2a;--red:#d63e4e;--side:#0a0a0a;--line:#4a4a4a}
html,body{font-size:15px;line-height:1.55}
aside{border-right:1px solid #262626;padding:28px 0}
.logo{border-bottom:1px solid #262626;padding:0 24px 24px}
.logo b{font:700 22px/1 "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.22em}
.logo span{font-size:12px;letter-spacing:.06em;color:#8d8d8d;margin-top:10px}
nav button{font-size:14px;padding:10px 24px;border-left:3px solid transparent;color:#c9c9c9}
nav button.on{background:#1c1c1c;border-left-color:var(--red);color:#fff;font-weight:600}
main{padding:36px 44px 72px}
h1{font-size:24px;font-weight:600}
.bar{height:3px;width:40px;margin:12px 0 16px}
.grid{background:var(--panel);border:1px solid var(--bd);padding:20px;gap:16px 20px}
label{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.03em;text-transform:uppercase}
input,select{border:1px solid var(--line);background:var(--bg);padding:9px 11px}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
nav button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
table{background:var(--panel);border:1px solid var(--bd)}
td,th{padding:10px 16px;border-bottom:1px solid var(--hair)}
tr.h th{background:none;color:var(--red);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px 16px 8px;border-bottom:1px solid var(--bd)}
td:last-child{font-weight:600}
tr.k td:last-child{color:var(--red);font-size:17px}
thead th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bd)}
.note{background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--red);padding:10px 14px}
.sub{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);border-bottom:1px solid var(--bd);padding-bottom:8px;margin:32px 0 14px}
.plots>div{background:var(--panel);border:1px solid var(--bd);padding:4px 16px 16px}
.plots .sub{margin-top:12px}
.btn{border:1px solid var(--line);font-size:14px}
.btn.red{background:var(--red);border-color:var(--red)}
.erow input,.erow select{padding:7px 8px;font-size:13.5px}
.erow.hd span{color:var(--mut);font-size:12px;text-transform:uppercase}
.elw{background:var(--panel);border:1px solid var(--bd);padding:14px;margin-bottom:14px}
@media (max-width:820px){aside{border-right:0;border-bottom:1px solid #262626;padding:16px 0 0}.logo{padding:0 16px 12px;border:0}nav button{border-left:0;border-bottom:3px solid transparent;padding:10px 14px}nav button.on{border-bottom-color:var(--red)}main{padding:22px 14px 56px}.grid{padding:14px}}
.logo img{display:block;width:100%;max-width:210px;height:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mark{height:50px;width:auto;opacity:.9}
.ft{margin-top:56px;padding-top:20px;border-top:1px solid var(--bd)}
.ft img{height:44px;width:auto;opacity:.85;display:block}
@media (prefers-color-scheme:dark){.mark{filter:brightness(1.4)}}
@media (max-width:820px){.logo img{max-width:160px}.mark{height:40px}}
</style>
</head>
<body>

<aside>
<div class="logo"><img id="lg" alt="JCJENSON"><span>Радиолюбительские расчёты</span></div>
<nav id="nav"></nav>
</aside>
<main id="main"></main>
</div>

const n=id=>parseFloat(String($(id).value).replace(',','.'));
const sig=(x,s=4)=>isFinite(x)?Number(x.toPrecision(s)).toLocaleString('ru-RU',{maximumFractionDigits:12}):'—';
const sg=(x,s=4)=>(x>0?'+':x<0?'−':'')+sig(Math.abs(x),s);
const eng=(x,u)=>{if(!isFinite(x))return '—';if(x>=1)return sig(x)+' '+u;for(const[s,p]of[[1e-3,'м'],[1e-6,'мк'],[1e-9,'н']])if(x>=s*.9995)return sig(x/s)+' '+p+u;return sig(x/1e-12)+' п'+u};
const log=Math.log10;
const fld=(id,l,v)=>`<div><label for="${id}">${l}</label><input id="${id}" value="${v}" inputmode="decimal" autocomplete="off"></div>`;
const sel=(id,l,o)=>`<div><label for="${id}">${l}</label><select id="${id}">${o.map(([v,t],i)=>`<option value="${v}">${t}</option>`).join('')}</select></div>`;
const tbl=r=>'<table>'+r.map(([a,b,c])=>c==='h'?`<tr class="h"><th colspan="2">${a}</th></tr>`:`<tr class="${c||''}"><td>${a}</td><td>${b}</td></tr>`).join('')+'</table>';
const out=(h,id='out')=>$(id).innerHTML=h;

/* ---------- Антенны ---------- */
function ant(){
const f=n('a_f'),kd=n('a_kd'),kv=n('a_kv'),kq=n('a_kq'),al=n('a_al'),H=n('a_h'),vf=n('a_vf');
const D=150*kd/f,V=150*kv/f,Q=75*kq/f,leg=V/2,r=al*Math.PI/360;
const span=2*leg*Math.sin(r),end=H-leg*Math.cos(r);
out(tbl([
['Длина волны',sig(299.792458/f)+' м'],
['Полуволновый диполь','','h'],
['Полная длина',sig(D)+' м','k'],['Одно плечо',sig(D/2)+' м'],
['V-диполь (inverted V)','','h'],
['Полная длина',sig(V)+' м','k'],['Одно плечо',sig(leg)+' м'],
['Расстояние между концами',sig(span)+' м'],['Высота концов над землёй',sig(end)+' м'+(end<2.5?' — слишком низко':'')],
['Четвертьволновый штырь (GP)','','h'],
['Вертикальный штырь',sig(Q)+' м','k'],['Радиал (4 шт. и более)',sig(Q*1.05)+' м'],
['Отрезки коаксиального кабеля','','h'],
['Четвертьволновый (λ/4)',sig(75*vf/f)+' м'],['Полуволновый (λ/2, симм. 4:1)',sig(150*vf/f)+' м']
]));}

/* ---------- Кабель ---------- */
const CAB=[['RG-58',15],['RG-174',30],['RG-8X',10.5],['RG-213',6.5],['H155',5.7],['LMR-400',4.3],['RG-6 (75 Ом)',6.5]];
function cab(){
const f=n('c_f'),L=n('c_l'),A1=n('c_a'),P=n('c_p'),S=n('c_s');
const A=A1*Math.sqrt(f/100)*L/100,a=Math.pow(10,-A/10),rho=(S-1)/(S+1);
const eff=a*(1-rho*rho)/(1-a*a*rho*rho),tot=-10*log(eff),ri=rho*a,Si=(1+ri)/(1-ri);
out(tbl([
['Затухание кабеля на частоте',sig(A*100/L)+' дБ/100 м'],
['Потери в кабеле (согласованном)',sig(A)+' дБ'],
['Потери с учётом КСВ нагрузки',sig(tot)+' дБ','k'],
['КСВ на входе кабеля',sig(Si)],
['КПД линии',sig(eff*100)+' %'],
['Мощность на входе → в антенне',sig(P)+' Вт → '+sig(P*eff)+' Вт'],
['Рассеивается в кабеле',sig(P*(1-eff))+' Вт']
]));}

/* ---------- Фильтры ---------- */
function gv(t,k,L){const g=[];if(t==='b'){for(let i=1;i<=k;i++)g.push(2*Math.sin((2*i-1)*Math.PI/(2*k)));g.push(1);return g}
const b=Math.log(1/Math.tanh(L/17.37)),y=Math.sinh(b/(2*k)),a=i=>Math.sin((2*i-1)*Math.PI/(2*k)),bb=i=>y*y+Math.pow(Math.sin(i*Math.PI/k),2);
g[0]=2*a(1)/y;for(let i=2;i<=k;i++)g[i-1]=4*a(i-1)*a(i)/(bb(i-1)*g[i-2]);g.push(k%2?1:Math.pow(1/Math.tanh(b/4),2));return g}
function flt(){
const t=$('f_t').value,k=+$('f_n').value,f1=n('f_1'),f2=n('f_2'),Z=n('f_z'),Lr=n('f_r'),fx=n('f_x');
if(!(f2>f1)){out('<p class="note">Верхняя частота должна быть больше нижней.</p>');return}
const f0=Math.sqrt(f1*f2)*1e6,d=(f2-f1)*1e6/f0,w=2*Math.PI*f0,g=gv(t,k,Lr);
const rows=[['Параметры','','h'],['Средняя частота',sig(f0/1e6)+' МГц'],['Относительная полоса',sig(d*100)+' %'],['Нагрузочная добротность',sig(1/d)],['Сопротивление нагрузки',sig(Z*g[k])+' Ом']];
rows.push(['Элементы (от источника)','','h']);
for(let i=0;i<k;i++){const x=g[i];
if(i%2===0){rows.push([`Звено ${i+1}: последовательный контур`,`L ${eng(x*Z/(w*d),'Гн')} + C ${eng(d/(w*x*Z),'Ф')}`])}
else{rows.push([`Звено ${i+1}: параллельный контур на землю`,`L ${eng(Z*d/(w*x),'Гн')} ‖ C ${eng(x/(Z*w*d),'Ф')}`])}}
const W=Math.abs(fx/(f0/1e6)-(f0/1e6)/fx)/d;let A;
if(t==='b')A=10*log(1+Math.pow(W,2*k));else{const e2=Math.pow(10,Lr/10)-1;const T=W<=1?Math.cos(k*Math.acos(W)):Math.cosh(k*Math.acosh(W));A=10*log(1+e2*T*T)}
rows.push(['Подавление','','h'],['На частоте '+sig(fx)+' МГц',sig(A)+' дБ','k']);
out(tbl(rows));}

function swr(){
const m=$('s_m').value;
document.querySelectorAll('[data-m]').forEach(e=>e.style.display=e.dataset.m.split(' ').includes(m)?'':'none');
let G;
if(m==='swr'){const s=n('s_s');G=(s-1)/(s+1)}
else if(m==='rl')G=Math.pow(10,-n('s_rl')/20);
else if(m==='gam')G=n('s_g');
else if(m==='pw')G=Math.sqrt(n('s_pr')/n('s_pf'));
else{const z=n('s_z0'),r=n('s_r'),x=n('s_x');G=Math.hypot(r-z,x)/Math.hypot(r+z,x)}
if(!(G>=0&&G<1)){out('<p class="note">Проверьте введённые значения: модуль коэффициента отражения должен быть от 0 до 1.</p>');return}
const S=(1+G)/(1-G),ev=S<1.5?'отлично':S<2?'хорошо':S<3?'допустимо, но потери растут':'плохо, нужна настройка';
out(tbl([['КСВ',sig(S,4),'k'],['Коэффициент отражения |Γ|',sig(G,4)],['Потери возврата',G>0?sig(-20*log(G))+' дБ':'∞'],['Потери на рассогласование',sig(-10*log(1-G*G))+' дБ'],
['Отражённая мощность',sig(G*G*100)+' %'],['Переданная мощность',sig((1-G*G)*100)+' %'],['Оценка',ev]]));}

/* ---------- Конструктор антенн ---------- */
let EL=[],GR='g';
const TY=[['v','Вертикальный λ/2'],['hx','Горизонтальный вдоль X'],['hy','Горизонтальный вдоль Y']];
const AX={v:[0,0,1],hx:[1,0,0],hy:[0,1,0]};
const rd=x=>Math.round(x*100)/100;
function loadPreset(i,f){const L=299.792458/f,E=(t,x,y,z,a,ph)=>({t,x:rd(x),y:rd(y),z:rd(z),a,ph});
if(i===1){EL=[E('hx',0,0,L/2,1,0)];GR='g'}
else if(i===2){EL=[E('v',0,0,0,1,0)];GR='g'}
else if(i===3){EL=[E('v',0,0,0,1,0),E('v',L/4,0,0,1,-90)];GR='g'}
else if(i===4){EL=[E('v',0,-L/4,0,1,0),E('v',0,L/4,0,1,0)];GR='g'}
else if(i===5){EL=[E('hx',0,0,0,1,0)];GR='n'}}
const rowsHTML=()=>`<div class="elw"><div class="erow hd"><span>Тип</span><span>X, м</span><span>Y, м</span><span>Z, м</span><span>Ампл.</span><span>Фаза, °</span><span></span></div>`+EL.map((e,i)=>`<div class="erow"><select aria-label="Тип">${TY.map(t=>`<option value="${t[0]}"${t[0]===e.t?' selected':''}>${t[1]}</option>`).join('')}</select>${['x','y','z','a','ph'].map(k=>`<input value="${e[k]}" inputmode="decimal" aria-label="${k}">`).join('')}<button class="btn" onclick="delEl(${i})" aria-label="Удалить элемент">×</button></div>`).join('')+'</div>';
const readEls=()=>[...document.querySelectorAll('.erow:not(.hd)')].map(r=>{const i=r.querySelectorAll('input'),v=k=>parseFloat(String(i[k].value).replace(',','.'))||0;return{t:r.querySelector('select').value,x:v(0),y:v(1),z:v(2),a:v(3),ph:v(4)}});
function addEl(){if(EL.length>=8)return;EL=readEls();EL.push({t:'v',x:0,y:0,z:0,a:1,ph:0});$('els').innerHTML=rowsHTML();gcalc()}
function delEl(i){EL=readEls();EL.splice(i,1);$('els').innerHTML=rowsHTML();gcalc()}
function Ufn(v,els,k,gr){const re=[0,0,0],im=[0,0,0];
for(const e of els)for(const m of(gr?[1,-1]:[1])){const p=[e.x,e.y,m===1?e.z:-e.z],u=AX[e.t],s=m===1||e.t==='v'?1:-1;
const c=u[0]*v[0]+u[1]*v[1]+u[2]*v[2],den=1-c*c;if(den<1e-9)continue;
const a=e.a*s*Math.cos(Math.PI/2*c)/den,ph=k*(v[0]*p[0]+v[1]*p[1]+v[2]*p[2])+e.ph*Math.PI/180,cr=a*Math.cos(ph),ci=a*Math.sin(ph);
for(let i=0;i<3;i++){const w=u[i]-c*v[i];re[i]+=cr*w;im[i]+=ci*w}}
return re[0]*re[0]+re[1]*re[1]+re[2]*re[2]+im[0]*im[0]+im[1]*im[1]+im[2]*im[2]}
function polar(pts,closed,lab){const cx=160,cy=160,R=130,D=Math.PI/180;
let s='<svg viewBox="0 0 320 320" role="img" style="width:100%;max-width:420px;display:block">';
for(const d of[0,10,20,30]){const r=R*(40-d)/40;s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--hair)" stroke-width="1"/><text x="${cx+3}" y="${cy-r+11}">${d?'−'+d:'0 дБ'}</text>`}
s+=`<line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" style="stroke:var(--hair)"/><line x1="${cx}" y1="${cy-R}" x2="${cx}" y2="${cy+R}" style="stroke:var(--hair)"/>`;
s+=`<text x="${cx+R+4}" y="${cy+4}">${lab[0]}</text><text x="${cx}" y="${cy-R-6}" text-anchor="middle">${lab[1]}</text><text x="${cx-R-4}" y="${cy+4}" text-anchor="end">${lab[2]}</text><text x="${cx}" y="${cy+R+16}" text-anchor="middle">${lab[3]}</text>`;
let d='',pen=false;
pts.forEach(([a,v])=>{if(!isFinite(v)){pen=false;return}const r=R*(Math.max(v,-40)+40)/40;d+=(pen?'L':'M')+(cx+r*Math.cos(a*D)).toFixed(1)+' '+(cy-r*Math.sin(a*D)).toFixed(1);pen=true});
return s+`<path d="${d}${closed?'Z':''}" fill="none" style="stroke:var(--red)" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
function gcalc(){
const f=n('g_f'),g=$('g_g').value==='g',els=readEls().filter(e=>e.a>0);
if(!els.length||!(f>0)){out('<p class="note">Добавьте хотя бы один элемент с ненулевой амплитудой и задайте частоту.</p>');return}
const k=2*Math.PI*f/299.792458,D=Math.PI/180;
const Uv=v=>(g&&v[2]<-1e-9)?0:Ufn(v,els,k,g);
const U=(az,el)=>{const c=Math.cos(el*D);return Uv([c*Math.cos(az*D),c*Math.sin(az*D),Math.sin(el*D)])};
let mx=0,ma=0,me=0,sum=0;
for(let el=g?0:-90;el<=90;el++)for(let az=0;az<360;az++){const u=U(az,el);sum+=u*Math.cos(el*D);if(u>mx){mx=u;ma=az;me=el}}
if(!(mx>0)){out('<p class="note">Излучение отсутствует. Проверьте типы и положения элементов.</p>');return}
sum*=D*D;const G=10*log(4*Math.PI*mx/sum);
let ec=parseFloat(String($('g_e').value).replace(',','.')),ac=parseFloat(String($('g_a').value).replace(',','.'));
if(!isFinite(ec))ec=me;if(!isFinite(ac))ac=ma;
const db=u=>u>0?10*log(u/mx):-Infinity,A=[],E=[];
for(let a=0;a<360;a++)A.push([a,db(U(a,ec))]);
for(let t=-90;t<270;t++){const c=Math.cos(t*D);E.push([t,db(Uv([c*Math.cos(ac*D),c*Math.sin(ac*D),Math.sin(t*D)]))])}
const pk=a=>{let p=0;a.forEach((v,i)=>{if(v[1]>a[p][1])p=i});return p};
const bw=a=>{const p=pk(a),N=a.length,lim=a[p][1]-3;let l=0,r=0;while(l<N&&a[(p-l-1+N)%N][1]>=lim)l++;while(r+l<N&&a[(p+r+1)%N][1]>=lim)r++;return l+r+1>=N?'круговая':sig(l+r+1,3)+'°'};
const pa=pk(A),op=A[(pa+180)%360][1],fb=A[pa][1]-op;
out(tbl([['Результаты','','h'],['Максимальное усиление',sig(G,3)+' дБи','k'],['Направление максимума','азимут '+ma+'°, угол места '+me+'°'],
['Ширина луча по азимуту (−3 дБ)',bw(A)],['Ширина луча по углу места (−3 дБ)',bw(E)],['Подавление заднего лепестка',isFinite(fb)&&fb<60?sig(fb,3)+' дБ':'более 60 дБ']])+
`<div class="plots"><div><h2 class="sub">Азимутальная, угол места ${sig(ec,3)}°</h2>${polar(A,true,['0°','90°','180°','270°'])}</div><div><h2 class="sub">Вертикальная, азимут ${sig(ac,3)}°</h2>${polar(E,false,['горизонт','зенит','горизонт','низ'])}</div></div>
<p class="note">Уровни относительно максимума, кольца через 10 дБ. Токи в элементах заданы вами; взаимное влияние элементов не учитывается, поэтому для директоров и рефлекторов подставляйте токи из моделирования.</p>`)}
